<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script> -->
</head>

<body>
    <div id="app">
        <h2>Login</h2>
        <form @submit.prevent="login">
            <label>Email:</label><br>
            <input type="email" v-model="email" required><br><br>

            <label>Password:</label><br>
            <input type="password" v-model="password" required><br><br>

            <button type="submit">Login</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.common.dev.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.0/axios.min.js" crossorigin="anonymous"></script>


    <script>
        new Vue({
            el: '#app',
            data: {
                email: '',
                password: ''
            },
            methods: {
                login() {
                    axios.post('http://127.0.0.1:5000/login', {
                        email: this.email,
                        password: this.password
                    })
                        .then(response => {
                            console.log(' Response:', response.data);
                            localStorage.setItem("token",response.data.token);
                            console.log(localStorage.getItem("token"));
                            window.location.href="index.html"
                        })
                        .catch(error => {
                            console.error(' Error:', error.response ? error.response.data : error.message);
                        });
                }
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vue Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Vue.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <!-- Vue App Root -->
  <div id="app">
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Vue Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Profile</a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item" v-if="!isLoggedIn">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item" v-if="isLoggedIn">
              <a class="nav-link" href="#" @click.prevent="logout">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container mt-4">
      <div v-if="loading" class="text-center">
        <p>Loading dashboard data...</p>
      </div>
      <div v-else>
        <canvas id="bar-chart" width="800" height="450"></canvas>
      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Vue App -->
  <script>
    new Vue({
      el: "#app",
      data: {
        loading: true,
        products_name: [],
        products_sales: [],
        products_colour: [],
        isLoggedIn: false
      },
      methods: {
        fetchDashboard() {
          const token = localStorage.getItem("token");
          if (!token) {
            this.isLoggedIn = false;
            window.location.href = "login.html";
            return;
          }

          this.isLoggedIn = true;

          axios.get("http://127.0.0.1:5000/api/dashboard", {
            headers: { Authorization: "Bearer " + token }
          })
          .then(res => {
            this.products_name = res.data.products_name;
            this.products_sales = res.data.products_sales;
            this.products_colour = res.data.products_colour;
            this.loading = false;
            this.loadBarchart();
          })
          .catch(err => {
            console.error("Error loading dashboard:", err);
            alert("Session expired or unauthorized. Please login again.");
            this.logout();
          });
        },
        loadBarchart() {
          new Chart(document.getElementById("bar-chart"), {
            type: 'bar',
            data: {
              labels: this.products_name,
              datasets: [{
                label: "Sales per Product",
                backgroundColor: this.products_colour,
                data: this.products_sales
              }]
            },
            options: {
              legend: { display: false },
              title: {
                display: true,
                text: 'Sales per Product'
              }
            }
          });
        },
        logout() {
          localStorage.removeItem("token");
          this.isLoggedIn = false;
          window.location.href = "login.html";
        }
      },
      mounted() {
        this.fetchDashboard();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales Application</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Vue.js -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>

  <!-- Vue Router -->
  <script src="https://cdn.jsdelivr.net/npm/vue-router@3.5.4/dist/vue-router.min.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<div id="app">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">SalesApp</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <router-link to="/" class="nav-link">Home</router-link>
        </li>
        <li class="nav-item">
          <router-link to="api/sales" class="nav-link">Sales</router-link>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-4">
    <router-view></router-view>
  </div>
</div>

<script>
  // Home Page Component
  const Home = {
    template: `
      <div class="text-center py-5">
        <h1 class="text-primary mb-3">👋 Welcome to the Sales App</h1>
        <p class="lead mb-4">Track and manage your product sales effortlessly.</p>
        <button class="btn btn-outline-primary btn-lg" @click="$router.push('api/sales')">
          Go to Sales Dashboard →
        </button>
      </div>
    `
  };

  // Sales Page Component
  const Sales = {
    template: `
      <div>
        <h2 class="mb-4">📈 Record a Sale</h2>
        <div class="row">
          <!-- Form -->
          <div class="col-md-4">
            <form @submit.prevent="makeSale" class="card p-3 shadow-sm">
              <div class="mb-3">
                <label class="form-label">Select Product</label>
                <select v-model="pid" class="form-select" required>
                  <option disabled value="">-- Select Product --</option>
                  <option v-for="p in products" :value="p.id">{{ p.name }}</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" v-model="quantity" class="form-control" required min="1">
              </div>
              <button type="submit" class="btn btn-success w-100">Submit Sale</button>
            </form>
          </div>

          <!-- Sales Table -->
          <div class="col-md-8">
            <div class="card shadow-sm p-3">
              <h4 class="mb-3">Sales Records</h4>
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="(sale, index) in sales" :key="sale.id">
                    <td>{{ index + 1 }}</td>
                    <td>{{ getProductName(sale.pid) }}</td>
                    <td>{{ sale.quantity }}</td>
                    <td>{{ formatDate(sale.created_at) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `,
    data() {
      return {
        products: [],
        sales: [],
        pid: '',
        quantity: ''
      };
    },
    methods: {
      getProducts() {
        const token = localStorage.getItem('token');
        const headers = token ? { Authorization: 'Bearer ' + token } : {};

        axios.get('http://127.0.0.1:5000/api/products', { headers })
          .then(res => this.products = res.data)
          .catch(err => console.error("Failed to load products:", err));
      },
      getSales() {
        axios.get('http://127.0.0.1:5000/api/sales')
          .then(res => this.sales = res.data)
          .catch(err => console.error("Failed to load sales:", err));
      },
      makeSale() {
        const token = localStorage.getItem('token');
        const headers = token ? { Authorization: 'Bearer ' + token } : {};

        const payload = {
          pid: this.pid,
          quantity: this.quantity
        };

        axios.post('http://127.0.0.1:5000/api/sales', payload, { headers })
          .then(() => {
            alert("✅ Sale created successfully!");
            this.getSales();
            this.quantity = '';
          })
          .catch(err => {
            console.error("Failed to make sale:", err);
            alert("❌ Error creating sale.");
          });
      },
      getProductName(pid) {
        const product = this.products.find(p => p.id === pid);
        return product ? product.name : 'Unknown';
      },
      formatDate(dateStr) {
        return new Date(dateStr).toLocaleString();
      }
    },
    mounted() {
      this.getProducts();
      this.getSales();
    }
  };

  // Vue Router Configuration
  const routes = [
    { path: '/', component: Home },
    { path: 'api/sales', component: Sales }
  ];

  const router = new VueRouter({ routes });

  // Root Vue App
  new Vue({
    el: '#app',
    router
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Inventory</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">

  <div id="app" class="container my-5">

    <a href="#" @click.prevent="logout">Logout</a>

    <!-- Landing Page Header -->
    <div class="text-center mb-5">
      <h1 class="display-4">🛒 Product Inventory System</h1>
    </div>

    <!-- Product Form -->
    <div class="card shadow mb-4">
      <div class="card-header bg-primary text-white">Add New Product</div>
      <div class="card-body">
        <form @submit.prevent="saveProduct" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Name</label>
            <input v-model="name" type="text" class="form-control" placeholder="e.g. Sugar" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Buying Price</label>
            <input v-model="buying_price" type="number" class="form-control" placeholder="e.g. 50" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Selling Price</label>
            <input v-model="selling_price" type="number" class="form-control" placeholder="e.g. 70" />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success">Save Product</button>
            <span class="ms-3 fw-semibold" :style="{ color: textcolor }">{{ message }}</span>
          </div>
        </form>
      </div>
    </div>

    <!-- Product Table -->
    <div class="card shadow">
      <div class="card-header bg-secondary text-white">Product List</div>
      <div class="card-body p-0">
        <table class="table table-striped mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Buying Price</th>
              <th>Selling Price</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="prod in products" :key="prod.id">
              <td>{{ prod.id }}</td>
              <td>{{ prod.name }}</td>
              <td>{{ prod.buying_price }}</td>
              <td>{{ prod.selling_price }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Vue & Axios CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.common.dev.min.js"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.0/axios.min.js" crossorigin="anonymous"></script>

  <!-- Vue Logic -->
  <script>
    new Vue({
      el: '#app',
      data: {
        products: [],
        name: '',
        buying_price: '',
        selling_price: '',
        message: '',
        textcolor: ''
      },
      methods: {
        getProducts() {
          myHeader = {'headers' : {'Authorization': 'Bearer' + localStorage.getItem('token')}}
          axios.get('http://127.0.0.1:5000/api/products',myHeader)
            .then(res => this.products = res.data)
            .catch(err => console.error(err));
        },
        saveProduct() {
          if (!this.name || !this.buying_price || !this.selling_price) {
            this.textcolor = 'red';
            this.message = 'Ensure all fields are set';
          } else {
            const data = {
              name: this.name,
              buying_price: this.buying_price,
              selling_price: this.selling_price
            };

            myHeader = {'headers' : {'Authorization': 'Bearer' + localStorage.getItem('token')}}

            axios.post('http://127.0.0.1:5000/api/products', data, myHeader)
              .then(() => {
                this.textcolor = 'green';
                this.message = 'Product added successfully!';
                this.name = '';
                this.buying_price = '';
                this.selling_price = '';
                this.getProducts();
              });
          }
        },
        logout() {
          localStorage.setItem("token", "")
          window.location.href = "login.html";

        }

      },
      mounted() {
        if (localStorage.getItem("token") == "") {
          window.location.href = "login.html";
        }
        else {
          this.getProducts();
          console.log(localStorage.getItem("token"));

        }

      }
    });
  </script>
</body>

</html>

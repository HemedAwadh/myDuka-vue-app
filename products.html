<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products - MyDuka</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" />

  <style>
  /* Navbar */
  .navbar {
    background: linear-gradient(90deg, #0077b6, #023e8a);
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
  }

  .navbar-brand {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .navbar-nav .nav-link {
    font-weight: 500;
    transition: 0.3s;
  }

  .navbar-nav .nav-link:hover {
    text-decoration: underline;
  }

  /* Buttons */
  .btn-primary {
    background: linear-gradient(90deg, #0077b6, #0096c7);
    border: none;
    border-radius: 25px;
    padding: 8px 20px;
    transition: 0.3s;
  }

  .btn-primary:hover {
    background: linear-gradient(90deg, #0096c7, #0077b6);
    transform: scale(1.05);
  }

  /* Table Styling */
  table.dataTable {
    border-radius: 10px;
    overflow: hidden;
  }

  table.dataTable thead {
    background: #0077b6;
    color: white;
  }

  table.dataTable tbody tr:hover {
    background-color: #e0f2f9 !important;
  }

  /* Modal */
  .modal-content {
    border-radius: 15px;
    box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
  }

  .modal-header {
    background: #0077b6;
    color: white;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
  }

  /* Footer */
  footer {
    background: linear-gradient(90deg, #0077b6, #023e8a);
    box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.1);
  }
</style>

</head>

<body>
  <div id="app">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">MyDuka</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav position-absolute top-50 start-50 translate-middle">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link text-white active fw-bold" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="sales.html">Sales</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="payments.html">Payments</a></li>
          </ul>

          <ul class="navbar-nav ms-auto">
            <li class="nav-item" v-if="!loggedIn"><a class="nav-link text-white" href="register.html">Register</a></li>
            <li class="nav-item" v-if="!loggedIn"><a class="nav-link text-white" href="login.html">Login</a></li>
            <li class="nav-item" v-if="loggedIn"><button @click="logout" class="btn btn-sm btn-light">Logout</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="container mt-4">

      <!-- Loader -->
      <div v-if="loading" class="text-center my-4">
        <div class="spinner-border text-primary"></div>
      </div>

      <!-- Add Product -->
      <button class="btn btn-primary mb-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#productModal">
        + Add Product
      </button>

      <!-- Modal -->
      <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
          <form @submit.prevent="saveProduct">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <div class="mb-3"><label class="form-label">Name</label><input v-model="name" type="text" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Buying Price</label><input v-model="buying_price" type="number" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Selling Price</label><input v-model="selling_price" type="number" class="form-control" required></div>
                <div class="text-center" v-if="loading"><div class="spinner-border text-primary"></div></div>
                <div class="text-center mt-2 fw-bold" :style="{ color: textcolor }">{{ message }}</div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-primary rounded-pill">Save</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Feedback Message -->
      <span class="fw-bold" :style="{ color: textcolor }">{{ message }}</span>

      <!-- Products Table -->
      <table id="productsTable" class="table table-striped table-hover mt-4 shadow-sm">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Buying Price</th>
            <th>Selling Price</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="prod in products" :key="prod.id">
            <td>{{ prod.id }}</td>
            <td>{{ prod.name }}</td>
            <td>{{ prod.buying_price }}</td>
            <td>{{ prod.selling_price }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <footer class="text-white text-center py-3 mt-5">
      <small>&copy; 2025 MyDuka. All rights reserved.</small>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.0/axios.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>

  <script>
    new Vue({
      el: "#app",
      data: {
        products: [],
        name: "",
        buying_price: "",
        selling_price: "",
        message: "",
        textcolor: "black",
        loading: false,
        loggedIn: false
      },
      methods: {
        getProducts() {
          this.loading = true;
          const myheader = {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem("token") }
          };
          axios.get('http://127.0.0.1:8000/api/products', myheader)
            .then(result => {
              this.products = result.data;
              this.$nextTick(() => {
                if ($.fn.DataTable.isDataTable('#productsTable')) {
                  $('#productsTable').DataTable().destroy();
                }
                $('#productsTable').DataTable();
              });
            })
            .catch(error => console.log(error))
            .finally(() => this.loading = false);
        },
        saveProduct() {
          if (!this.name || !this.buying_price || !this.selling_price) {
            this.textcolor = "red";
            this.message = "Ensure all fields are set";
            return;
          }
          this.loading = true;
          const data = { name: this.name, buying_price: this.buying_price, selling_price: this.selling_price };
          const myheader = { headers: { 'Authorization': 'Bearer ' + localStorage.getItem("token") } };
          axios.post('http://127.0.0.1:8000/api/products', data, myheader)
            .then(() => {
              this.textcolor = "green";
              this.message = "Product added successfully!";
              this.name = this.buying_price = this.selling_price = "";
              this.getProducts();
            })
            .catch(() => {
              this.textcolor = "red";
              this.message = "Error saving product.";
            })
            .finally(() => this.loading = false);
        },
        logout() {
          localStorage.removeItem("token");
          window.location.href = "login.html";
        }
      },
      mounted() {
        this.loggedIn = !!localStorage.getItem("token");
        if (!this.loggedIn) {
          window.location.href = "login.html";
        } else {
          this.getProducts();
        }
      }
    });
  </script>
</body>
</html>

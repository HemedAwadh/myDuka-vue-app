<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>

</head>

<body>
    <div id="app">
        <h2>Register</h2>
        <form @submit.prevent="login">

             <label>Full Name:</label><br>
            <input type="text" v-model="full_name" required><br><br>

            <label>Email:</label><br>
            <input type="email" v-model="email" required><br><br>

            <label>Password:</label><br>
            <input type="password" v-model="password" required><br><br>

            <button type="submit">Register</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.common.dev.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.0/axios.min.js" crossorigin="anonymous"></script>


    <script>
        new Vue({
            el: '#app',
            data: {
                full_name: '',
                email: '',
                password: ''
            },
            methods: {
                login() {
                    axios.post('http://127.0.0.1:5000/register', {
                        full_name: this.full_name,
                        email: this.email,
                        password: this.password
                    })
                        .then(response => {
                            console.log(' Response:', response.data);
                            localStorage.setItem("name","Awadh")
                            console.log(localStorage.getItem("name"));
                        })
                        .catch(error => {
                            console.error(' Error:', error.response ? error.response.data : error.message);
                        });
                }
            }
        });
    </script>
</body>

</html>
